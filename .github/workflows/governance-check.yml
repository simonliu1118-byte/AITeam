name: Governance Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate governance structure
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import pathlib, re, sys

          allowed = [
              re.compile(r'^REPOSITORY_RULES\.md$'),
              re.compile(r'^REPO_POLICY\.md$'),
              re.compile(r'^PROJECT_RULES\.md$'),
              re.compile(r'^RULES_INDEX\.md$'),
              re.compile(r'^COMMON_RULES_VERSION$'),
              re.compile(r'^COMMON_RULES_CHANGELOG\.md$'),
              re.compile(r'^GOVERNANCE_VERSION$'),
              re.compile(r'^GOVERNANCE_CHANGELOG\.md$'),
              re.compile(r'^AGENTS\.md$'),
          ]
          suspicious = re.compile(r'(?i)(rules|policy|instruction|governance|versioning|agents)')

          for path in pathlib.Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              rel = path.as_posix()
              if path.suffix.lower() not in {'.md', '.txt'} and path.name != 'AGENTS.md':
                  continue
              if suspicious.search(path.name) and not any(rx.fullmatch(rel) for rx in allowed):
                  print(f'ERROR: unauthorized/obsolete rules entrypoint: {rel}')
                  sys.exit(1)

          for rel in ['COMMON_RULES_VERSION','GOVERNANCE_VERSION','VERSION']:
              p = pathlib.Path(rel)
              if not p.is_file() or not re.fullmatch(r'\d+\.\d+\.\d+\n?', p.read_text(encoding='utf-8')):
                  print(f'ERROR: {rel} must contain X.Y.Z')
                  sys.exit(1)

          build = pathlib.Path('BUILD')
          if not build.is_file() or not re.fullmatch(r'\d+\n?', build.read_text(encoding='utf-8')):
              print('ERROR: BUILD must contain a non-negative integer')
              sys.exit(1)

          required = [
              'REPOSITORY_RULES.md','REPO_POLICY.md','PROJECT_RULES.md','RULES_INDEX.md',
              'COMMON_RULES_CHANGELOG.md','GOVERNANCE_CHANGELOG.md','AGENTS.md'
          ]
          for rel in required:
              if not pathlib.Path(rel).is_file():
                  print(f'ERROR: missing governance file: {rel}')
                  sys.exit(1)
          print('Governance structure OK')
          PY

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "main:refs/remotes/origin/main"
            mapfile -t changed < <(git diff --name-only "origin/main...HEAD")

            common_changed=0
            common_rules_changed=0
            common_version_changed=0
            common_changelog_changed=0
            repo_gov_changed=0
            gov_version_changed=0
            gov_changelog_changed=0

            for path in "${changed[@]}"; do
              case "$path" in
                REPOSITORY_RULES.md|COMMON_RULES_VERSION|COMMON_RULES_CHANGELOG.md)
                  common_changed=1 ;;
              esac
              [ "$path" = "REPOSITORY_RULES.md" ] && common_rules_changed=1
              [ "$path" = "COMMON_RULES_VERSION" ] && common_version_changed=1
              [ "$path" = "COMMON_RULES_CHANGELOG.md" ] && common_changelog_changed=1

              case "$path" in
                REPO_POLICY.md|PROJECT_RULES.md|RULES_INDEX.md|GOVERNANCE_VERSION|GOVERNANCE_CHANGELOG.md|AGENTS.md|.github/workflows/governance-check.yml)
                  repo_gov_changed=1 ;;
              esac
              [ "$path" = "GOVERNANCE_VERSION" ] && gov_version_changed=1
              [ "$path" = "GOVERNANCE_CHANGELOG.md" ] && gov_changelog_changed=1
            done

            if [ "$common_changed" -eq 1 ]; then
              case "$HEAD_REF" in governance/*) ;; *) echo "ERROR: common rules require governance/* branch"; exit 1 ;; esac
              [ "$common_rules_changed" -eq 1 ] || { echo "ERROR: common rules change must update REPOSITORY_RULES.md"; exit 1; }
              [ "$common_version_changed" -eq 1 ] || { echo "ERROR: common rules change must update COMMON_RULES_VERSION"; exit 1; }
              [ "$common_changelog_changed" -eq 1 ] || { echo "ERROR: common rules change must update COMMON_RULES_CHANGELOG.md"; exit 1; }
            fi

            if [ "$repo_gov_changed" -eq 1 ]; then
              case "$HEAD_REF" in governance/*) ;; *) echo "ERROR: repository governance requires governance/* branch"; exit 1 ;; esac
              [ "$gov_version_changed" -eq 1 ] || { echo "ERROR: repository governance change must update GOVERNANCE_VERSION"; exit 1; }
              [ "$gov_changelog_changed" -eq 1 ] || { echo "ERROR: repository governance change must update GOVERNANCE_CHANGELOG.md"; exit 1; }
            fi
          fi

          echo "Governance Check passed."
