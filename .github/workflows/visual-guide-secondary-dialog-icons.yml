name: Visual Guide Secondary Dialog Icons (one-time)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: visual-guide-secondary-dialog-icons-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'design/cy-desktop-secondary-dialog-icons'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply guarded visual guide patch
        run: |
          python tools/patch_visual_secondary_dialog_icon_rule.py
      - name: Commit final guide only
        run: |
          git config user.name "simonliu1118-byte"
          git config user.email "286269326+simonliu1118-byte@users.noreply.github.com"
          git add shared/cy-visual/desktop/CY_DESKTOP_VISUAL_GUIDE.md
          git rm tools/patch_visual_secondary_dialog_icon_rule.py
          git rm .github/workflows/visual-guide-secondary-dialog-icons.yml
          git commit -m "docs: standardize secondary dialog icon behavior"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
