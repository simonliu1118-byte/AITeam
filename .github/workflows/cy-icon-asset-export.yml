name: CY Icon Asset Export

on:
  push:
    branches:
      - design/cy-icon-family-canonical

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: design/cy-icon-family-canonical

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install cairosvg pillow

      - name: Export and verify icon assets
        run: |
          python shared/cy-visual/icon-family/tools/export_icons.py

      - name: Commit derived production assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/cy-visual/icon-family/ASSET_MANIFEST.json
          git add shared/cy-visual/icon-family/apps
          if git diff --cached --quiet; then
            echo "No derived-asset changes to commit."
            exit 0
          fi
          git commit -m "assets: export CY icon production binaries"
          git push origin HEAD:design/cy-icon-family-canonical
