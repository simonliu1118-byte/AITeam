name: Build AITeam Windows Portable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore win-x64
        shell: pwsh
        run: dotnet restore .\src\AITeam.App\AITeam.App.csproj -r win-x64

      - name: Build
        shell: pwsh
        run: dotnet build .\src\AITeam.App\AITeam.App.csproj -c Release -r win-x64 --no-restore

      - name: Publish self-contained single EXE
        shell: pwsh
        run: >
          dotnet publish .\src\AITeam.App\AITeam.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -o .\artifacts\publish

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath .\VERSION -Raw).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate clean publish
        shell: pwsh
        run: |
          $exe = ".\artifacts\publish\AITeam.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "AITeam.exe was not produced."
          }

          $unexpectedDlls = @(Get-ChildItem -LiteralPath .\artifacts\publish -Filter *.dll -File -ErrorAction SilentlyContinue)
          if ($unexpectedDlls.Count -gt 0) {
            throw "Single-file publish produced loose DLL files: $($unexpectedDlls.Name -join ', ')"
          }

          Write-Host "Publish output:"
          Get-ChildItem -LiteralPath .\artifacts\publish -Force | Select-Object Name, Length

      - name: Create clean ZIP package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $folderName = "AITeam-$version-win-x64"
          $packageRoot = ".\artifacts\package"
          $packageDir = Join-Path $packageRoot $folderName
          $zip = ".\artifacts\$folderName.zip"

          Remove-Item -LiteralPath $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $zip -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null

          Copy-Item -LiteralPath .\artifacts\publish\AITeam.exe -Destination (Join-Path $packageDir "AITeam.exe") -Force

          $note = @"
          AITeam $version

          直接雙擊 AITeam.exe 即可執行，不需要另外安裝 .NET。
          測試版會沿用 D:\AITeam 的既有專案與設定資料。
          "@
          [System.IO.File]::WriteAllText(
            (Join-Path $packageDir "使用說明.txt"),
            $note.Trim() + [Environment]::NewLine,
            (New-Object System.Text.UTF8Encoding($true)))

          Compress-Archive -Path $packageDir -DestinationPath $zip -CompressionLevel Optimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AITeam-${{ steps.version.outputs.version }}-win-x64
          path: artifacts/AITeam-${{ steps.version.outputs.version }}-win-x64.zip
          if-no-files-found: error

      - name: Tag and publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $zip = "artifacts/AITeam-$version-win-x64.zip"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force

          $existing = git rev-parse -q --verify "refs/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing = $existing.Trim()
            if ($existing -ne $env:GITHUB_SHA) {
              throw "Version $version already has tag $tag on another commit. Bump VERSION before merging another change."
            }
          }
          else {
            git tag -a $tag $env:GITHUB_SHA -m "AITeam $tag"
            git push origin $tag
          }

          if (gh release view $tag *> $null) {
            gh release upload $tag $zip --clobber
          }
          else {
            gh release create $tag $zip --title "AITeam $tag" --generate-notes
          }
