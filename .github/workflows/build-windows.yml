name: Build AITeam Windows Portable

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "src/**"
      - "tests/**"
      - "config-templates/**"
      - "VERSION"
      - "BUILD"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

concurrency:
  group: aiteam-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run AITeam.Core unit tests
        run: dotnet test tests/AITeam.Core.Tests/AITeam.Core.Tests.csproj -c Release

  build:
    needs: test
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Read VERSION and BUILD
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath .\VERSION -Raw).Trim()
          $build = (Get-Content -LiteralPath .\BUILD -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION: $version" }
          if ($build -notmatch '^\d+$') { throw "Invalid BUILD: $build" }

          # 使用者看到的版本格式：VX.Y.Z，BUILD > 0 時加上 Build N（共通規則 §6）。
          $display = "V$version"
          $fileLabel = "V$version"
          if ([int]$build -gt 0) {
            $display = "$display Build $build"
            $fileLabel = "$fileLabel-Build$build"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "build=$build" >> $env:GITHUB_OUTPUT
          "display=$display" >> $env:GITHUB_OUTPUT
          "file_label=$fileLabel" >> $env:GITHUB_OUTPUT

      - name: Restore win-x64
        shell: pwsh
        run: dotnet restore .\src\AITeam.App\AITeam.App.csproj -r win-x64

      - name: Build
        shell: pwsh
        run: dotnet build .\src\AITeam.App\AITeam.App.csproj -c Release -r win-x64 --no-restore

      - name: Publish self-contained single EXE
        shell: pwsh
        run: >
          dotnet publish .\src\AITeam.App\AITeam.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -o .\artifacts\publish

      - name: Validate clean publish
        shell: pwsh
        run: |
          $exe = ".\artifacts\publish\AITeam.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "AITeam.exe was not produced."
          }

          $unexpectedDlls = @(Get-ChildItem -LiteralPath .\artifacts\publish -Filter *.dll -File -ErrorAction SilentlyContinue)
          if ($unexpectedDlls.Count -gt 0) {
            throw "Single-file publish produced loose DLL files: $($unexpectedDlls.Name -join ', ')"
          }

      - name: Create clean engineering package
        shell: pwsh
        run: |
          $display = "${{ steps.version.outputs.display }}"
          # 下載的 Artifact 本身就是 zip，裡面直接放一層 AITeam 資料夾：解壓縮一次就是 AITeam 的家。
          $packageRoot = ".\artifacts\package"
          $packageDir = Join-Path $packageRoot "AITeam"

          Remove-Item -LiteralPath $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item -LiteralPath .\artifacts\publish\AITeam.exe -Destination (Join-Path $packageDir "AITeam.exe") -Force

          $note = @"
          AITeam $display

          Engineering / verification build.
          直接雙擊 AITeam.exe 即可執行，不需要另外安裝 .NET。
          這個 AITeam 資料夾就是 AITeam 的家：專案清單、Repo、紀錄都放在這裡。
          已經有舊的 D:\AITeam：解壓縮時目的地選 D:\，覆蓋 AITeam.exe 即可，原本的資料都不用動。
          GitHub workflow run: $env:GITHUB_RUN_NUMBER
          Commit: $env:GITHUB_SHA
          "@
          [System.IO.File]::WriteAllText(
            (Join-Path $packageDir "使用說明.txt"),
            $note.Trim() + [Environment]::NewLine,
            (New-Object System.Text.UTF8Encoding($true)))

      - name: Upload engineering artifact
        uses: actions/upload-artifact@v7
        with:
          name: AITeam-${{ steps.version.outputs.file_label }}
          path: artifacts/package/
          if-no-files-found: error
          retention-days: 14
