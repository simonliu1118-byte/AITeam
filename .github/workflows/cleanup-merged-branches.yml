name: Cleanup Merged Branches

# Same approach as CYapps: a merged PR's short-term branch is deleted by Actions, because
# the AI working environments cannot delete remote refs themselves. The push job removes
# branches that were merged before this workflow existed.
on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-merged-branches.yml"

permissions:
  contents: write

jobs:
  cleanup-merged-head:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged short-term branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$HEAD_BRANCH" = "main" ]; then exit 0; fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_BRANCH"

  cleanup-existing-merged-branches:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches already merged into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branches=(
            "governance/icon-erp-autoquery"
          )
          for branch in "${branches[@]}"; do
            if gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" --silent; then
              echo "Deleted $branch"
            else
              echo "Already absent or not deletable: $branch"
            fi
          done
