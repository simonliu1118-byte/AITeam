name: Release AITeam Windows Portable

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aiteam-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Read VERSION
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath .\VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION: $version" }
          $tag = "v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Confirm tag does not already exist
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          git fetch --tags --force
          $existing = git rev-parse -q --verify "refs/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Tag $tag already exists. Bump VERSION in main before releasing again."
          }

      - name: Run AITeam.Core unit tests
        shell: pwsh
        run: dotnet test tests\AITeam.Core.Tests\AITeam.Core.Tests.csproj -c Release

      - name: Scan tracked source for likely secrets
        shell: pwsh
        run: |
          $pattern = 'ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|-----BEGIN (RSA|OPENSSH|EC|PRIVATE) |AKIA[0-9A-Z]{16}'
          git grep -nEI $pattern -- . ':!*.md' | Out-String -OutVariable hits | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host $hits
            throw "Possible secret pattern found in tracked source; release aborted."
          }

      - name: Restore win-x64
        shell: pwsh
        run: dotnet restore .\src\AITeam.App\AITeam.App.csproj -r win-x64

      - name: Build
        shell: pwsh
        run: dotnet build .\src\AITeam.App\AITeam.App.csproj -c Release -r win-x64 --no-restore

      - name: Publish self-contained single EXE
        shell: pwsh
        run: >
          dotnet publish .\src\AITeam.App\AITeam.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -o .\artifacts\publish

      - name: Validate clean publish
        shell: pwsh
        run: |
          $exe = ".\artifacts\publish\AITeam.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "AITeam.exe was not produced."
          }

          $unexpectedDlls = @(Get-ChildItem -LiteralPath .\artifacts\publish -Filter *.dll -File -ErrorAction SilentlyContinue)
          if ($unexpectedDlls.Count -gt 0) {
            throw "Single-file publish produced loose DLL files: $($unexpectedDlls.Name -join ', ')"
          }

      - name: Create release package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $folderName = "AITeam-$version-win-x64"
          $packageRoot = ".\artifacts\package"
          $packageDir = Join-Path $packageRoot $folderName
          $zip = ".\artifacts\$folderName.zip"

          Remove-Item -LiteralPath $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $zip -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null

          Copy-Item -LiteralPath .\artifacts\publish\AITeam.exe -Destination (Join-Path $packageDir "AITeam.exe") -Force

          $note = @"
          AITeam v$version

          直接雙擊 AITeam.exe 即可執行，不需要另外安裝 .NET。
          正式版會沿用 D:\AITeam 的既有專案與設定資料。
          "@
          [System.IO.File]::WriteAllText(
            (Join-Path $packageDir "使用說明.txt"),
            $note.Trim() + [Environment]::NewLine,
            (New-Object System.Text.UTF8Encoding($true)))

          Compress-Archive -Path $packageDir -DestinationPath $zip -CompressionLevel Optimal

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zip = "artifacts/AITeam-$version-win-x64.zip"
          $sha256 = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          "$sha256  AITeam-$version-win-x64.zip" | Out-File -Encoding ascii "artifacts/AITeam-$version-win-x64.zip.sha256"

      - name: Tag release commit
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $tag $env:GITHUB_SHA -m "AITeam $tag"
          git push origin $tag

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"
          gh release create $tag `
            "artifacts/AITeam-$version-win-x64.zip" `
            "artifacts/AITeam-$version-win-x64.zip.sha256" `
            --title "AITeam $tag" `
            --generate-notes
